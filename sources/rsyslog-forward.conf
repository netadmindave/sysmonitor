# Forward a Linux host's logs to SysMonitor (Proxmox host, LXC containers, any Debian box).
# Save as /etc/rsyslog.d/90-sysmonitor.conf, then: systemctl restart rsyslog
# (If rsyslog is missing: apt install rsyslog)
# TCP with octet framing survives restarts; the queue buffers while SysMonitor is down.
*.* action(type="omfwd" target="SYSMONITOR_IP" port="5514" protocol="tcp"
           TCP_Framing="octet-counted"
           action.resumeRetryCount="-1" queue.type="linkedList" queue.size="10000")
