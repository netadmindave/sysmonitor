# Nginx Proxy Manager: send every proxy host's access log to SysMonitor as well.
# Save as <NPM data folder>/nginx/custom/server_proxy.conf (create the folders), then restart NPM.
# NPM includes this file inside every proxy host; its local access logs keep working.
access_log syslog:server=SYSMONITOR_IP:5514,tag=npm,severity=info proxy;
